name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# GITHUB_TOKEN needs these for the Pages deployment to be accepted.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
        working-directory: web

      - run: bun run build
        working-directory: web
        env:
          # Must be the full origin of the Vercel API, e.g. https://nurtura.vercel.app
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          BASE_PATH: /${{ github.event.repository.name }}/

      # No router, so a deep link can only ever be the index; copying it to
      # 404.html keeps a stray refresh from showing the Pages error page.
      - run: cp web/dist/index.html web/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
